# Blueprint для Render: сервер из папки server/. Секреты здесь не хранятся —
# значения с sync: false вводятся один раз в панели Render, JWT_SECRET Render генерирует сам.
services:
  - type: web
    name: recipes-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass # деплой только после зелёного CI (.github/workflows/ci.yml)
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://jessk1y.github.io
      - key: FRONTEND_URL
        value: https://jessk1y.github.io/recipes
      - key: MAIL_FROM_NAME
        value: Рецепты
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # почтовые ключи НЕобязательны: без них сервер стартует в режиме «почта отключена» (см. server/README.md)
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # Web Push для админа (npm run push:keys); необязательны: без них уведомления отключены
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # капча Cloudflare Turnstile (регистрация и отправка предложения); необязательны: без них капча выключена.
      # Нужны оба сразу: секретный — только здесь, публичный отдаётся фронтенду через GET /config
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
