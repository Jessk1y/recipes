# Локальная PostgreSQL для разработки: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: recipes-db
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes
    ports:
      - "5433:5432"
    volumes:
      - recipes-pgdata:/var/lib/postgresql/data
volumes:
  recipes-pgdata:
